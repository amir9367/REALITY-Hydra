[package]
name = "hydra-cli"
description = "REALITY-Hydra Phase 6: server-side epoch automation. Loads hydra.toml, derives the current epoch's accepted serverNames (the ±1 union), and renders them as lines, JSON, or a paste-ready stock Xray REALITY inbound (REALITY.md §11)."
edition.workspace = true
version.workspace = true
license.workspace = true
rust-version.workspace = true

# Two targets: a thin `hydra` binary and the library it is a shell over, so the
# whole rendering/derivation surface is unit-testable without spawning a process.
[lib]
name = "hydra_cli"
path = "src/lib.rs"

[[bin]]
name = "hydra"
path = "src/main.rs"

[dependencies]
# The keyed epoch pool: this crate is pure glue over it.
pool-engine = { path = "../pool-engine" }
# REALITY key material for `keygen` / `init` (X25519 keypair, OsRng).
reality-tls = { path = "../reality-tls" }
# The SOCKS5 client, exposed via `hydra serve`.
hydra-client = { path = "../hydra-client" }
# The self-tunnel exit node, exposed via `hydra server`.
hydra-server = { path = "../hydra-server" }
# Shared tunnel constants (default clock-skew window) for the server args.
tunnel-proto = { path = "../tunnel-proto" }
# Resolver type used by the mock client pipeline in `hydra serve`.
dns-warmer = { path = "../dns-warmer" }
# CLI parsing for the `hydra` binary.
clap = { workspace = true }
# JSON output (a serverNames array and the Xray inbound snippet).
serde_json = { workspace = true }
# base64 for emitting generated secrets/keys into hydra.toml.
base64 = { workspace = true }
# Async runtime for `hydra serve`.
tokio = { workspace = true }
thiserror.workspace = true

[features]
# Forwarded to hydra-client so `hydra serve` can use the real client stack.
default = []
live-dns = ["hydra-client/live-dns"]
boring-impersonate = ["hydra-client/boring-impersonate"]
full = ["live-dns", "boring-impersonate"]
