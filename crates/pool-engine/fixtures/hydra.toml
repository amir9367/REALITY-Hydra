# Hydra config — real high-reputation domains for SNI pool rotation.
# All domains below are hosted on major CDNs. Adjust `dest` and
# `coherence_cidrs` to match YOUR server's actual CDN fronting.
master_secret = "base64:Mdzc9T8bRDckIYNV8C256E+OsuYfBiEca20zKwWhgo8="  # 32 bytes — ROTATE before production!
server_salt   = "base64:gLx8cgG8iAnZTZMiplCwEg=="                      # 16 bytes — ROTATE before production!
pool_format   = "hydra-pool-v1"
epoch_len     = "6h"
