[package]
name = "hydra-client"
description = "REALITY-Hydra Phase 5: integration crate — SOCKS5 inbound → PoolEngine → Selector → DnsWarmer → RealityTLS → CDN edge → Xray server."
edition.workspace = true
version.workspace = true
license.workspace = true
rust-version.workspace = true

[[bin]]
name = "hydra-client"
path = "src/main.rs"

[dependencies]
pool-engine = { path = "../pool-engine" }
dns-warmer = { path = "../dns-warmer" }
reality-tls = { path = "../reality-tls" }
# The authenticated CONNECT header the client sends the exit node.
tunnel-proto = { path = "../tunnel-proto" }
tokio = { workspace = true }
# Client-side TLS to the exit node, with a SHA-256 pin on the self-signed cert.
tokio-rustls.workspace = true
rustls.workspace = true
rustls-pki-types.workspace = true
sha2.workspace = true
thiserror.workspace = true
serde.workspace = true
serde_json.workspace = true
base64.workspace = true
clap = { workspace = true }

[features]
default = []
live-dns = ["dns-warmer/live-dns"]
boring-impersonate = ["reality-tls/boring-impersonate"]
full = ["live-dns", "boring-impersonate"]
